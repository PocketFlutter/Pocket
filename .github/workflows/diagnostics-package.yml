name: Publish Diagnostics Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pocket-diagnostics-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-diagnostics-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@pocketflutter"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run diagnostics package tests
        working-directory: sdk
        run: bun test packages/pocket_diagnostics/test/diagnostics.test.ts

      - name: Stage and publish @pocketflutter/diagnostics
        id: publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage_dir="${RUNNER_TEMP}/pocket-github-diagnostics-stage"
          node sdk/scripts/package_github_diagnostics.mjs --out "$stage_dir"
          cd "$stage_dir"
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts --json > pack.json
          tarball="$(node -p "require('./pack.json')[0].filename")"
          integrity="$(node -p "require('./pack.json')[0].integrity")"
          package="@pocketflutter/diagnostics@${version}"

          if published_integrity="$(npm view "$package" dist.integrity 2>npm-view.log)"; then
            if [[ "$published_integrity" != "$integrity" ]]; then
              echo "Published package differs from the staged tarball. Bump the package version." >&2
              exit 1
            fi
            echo "$package is already published with matching integrity."
          elif grep -q 'E404' npm-view.log; then
            npm publish "./$tarball" --ignore-scripts --access restricted
          else
            cat npm-view.log >&2
            exit 1
          fi

      - name: Verify consumer install and execution outside workspace
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          consumer_dir="${RUNNER_TEMP}/pocket-diagnostics-consumer"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          cat > package.json <<'JSON'
          {
            "name": "pocket-diagnostics-consumer-smoke",
            "private": true,
            "type": "module"
          }
          JSON
          cat > .npmrc <<'INI'
          @pocketflutter:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          INI
          npm install --save-exact "@pocketflutter/diagnostics@${PACKAGE_VERSION}"
          cat > verify.ts <<'TS'
          import { createDiagnosticsCollector } from "@pocketflutter/diagnostics";
          import { createFileDiagnostics } from "@pocketflutter/diagnostics/node";
          import { join } from "node:path";

          const portable = createDiagnosticsCollector({
            context: { source: "portable-smoke", projectId: "pilot" },
          });
          await portable.recordLog({ severity: "info", message: "portable log ok" });
          await portable.recordCrash(new Error("portable crash ok"));
          const portableLogs = await portable.listLogs();
          const portableCrashes = await portable.listCrashes();
          if (portableLogs.length !== 1 || portableLogs[0]?.message !== "portable log ok") {
            throw new Error("Portable log query mismatch");
          }
          if (portableCrashes.length !== 1 || portableCrashes[0]?.error.message !== "portable crash ok") {
            throw new Error("Portable crash query mismatch");
          }
          await portable.close();

          const journalDir = join(process.cwd(), "journal");
          const fileDiag = createFileDiagnostics({
            directory: journalDir,
            context: { source: "node-smoke", projectId: "pilot" },
          });
          const logRec = await fileDiag.recordLog("node file log ok");
          const crashRec = await fileDiag.recordCrash(new Error("node file crash ok"));
          await fileDiag.close();

          const reopened = createFileDiagnostics({ directory: journalDir });
          const all = await reopened.list();
          const recent = await reopened.getCrashRecentLogs(crashRec.id);
          if (all.length !== 2 || recent.length !== 1 || recent[0]?.id !== logRec.id) {
            throw new Error("File diagnostics query mismatch across reopen");
          }
          await reopened.close();
          TS
          bun verify.ts
