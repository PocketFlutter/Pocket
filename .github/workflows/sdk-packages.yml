name: Publish SDK Packages

on:
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - 'demo/js/bun.lock'
      - 'demo/js/apps/lantern/bun.lock'
      - 'sdk/bun.lock'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk/packages/**'
      - 'sdk/editor/version_store.ts'
      - 'sdk/scripts/package_update.ts'
      - 'sdk/scripts/package_github_packages.mjs'
      - 'sdk/scripts/release_sdk_packages.mjs'
      - 'sdk/scripts/tests/release_sdk_packages.test.ts'
      - 'sdk/scripts/verify_github_packages.ts'
      - '.github/workflows/sdk-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pocket-sdk-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@pocketflutter"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run host package regression tests
        run: |
          bun test sdk/scripts/tests/release_sdk_packages.test.ts \
            sdk/packages/pocket_diagnostics/test sdk/packages/pocket_cos/test \
            sdk/packages/pocket_vn/test/engine.test.ts \
            sdk/packages/pocket_live2d/test/live2d.test.ts sdk/packages/pocket_live2d/test/interaction.test.ts

      - name: Publish checked-in versions and verify a clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sdk/scripts/release_sdk_packages.mjs --publish
